<!doctype html>
<html class="light" lang="en">
  <head>
    {% include "partials/head.html" %}
  </head>
  <body class="main-wrapper">
    <div class="flex h-screen overflow-hidden">
      {% include "partials/sidebar.html" %}

      <!-- RIGHT SIDE CONTAINER -->
      <div class="flex-1 flex flex-col h-full overflow-hidden">
        {% include "partials/navbar.html" %}

        <!-- SCROLLABLE CONTENT -->
        <main class="main-content">
          {% block content %}{% endblock %}

          {% include "partials/footer.html" %}
        </main>
      </div>
    </div>

    <!-- FAB -->
    <button
      class="fixed bottom-lg right-lg w-12 h-12 bg-primary-container border border-black rounded-full flex items-center justify-center text-white hover:bg-primary transition-colors z-50"
    >
      <span class="material-symbols-outlined font-bold text-white">add</span>
    </button>

    <!-- JS Entry Point -->
    <script type="module" src="/assets/main.js"></script>
  </body>
</html>
